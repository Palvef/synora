name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synora_test
          POSTGRES_PASSWORD: synora_ci
          POSTGRES_DB: synora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synora_test -d synora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format, versions, Clippy, tests and build
        env:
          SYNORA_TEST_PG_URL: postgresql://synora_test:synora_ci@127.0.0.1:5432/synora_test
        run: scripts/ci.sh
