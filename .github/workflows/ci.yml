name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        id: fmt
        run: |
          if cargo fmt --all -- --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cargo fmt --all
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rustfmt
        if: steps.fmt.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply rustfmt"
          git push

      - name: Check VERSION matches Cargo.lock
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\([0-9.]*\)".*/\1/')
          lock_ver=$(awk '$0=="name = \"synora-core\""{getline; if ($1=="version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)
          test "$ver" = "$cargo_ver" || { echo "VERSION ($ver) != Cargo.toml ($cargo_ver)"; exit 1; }
          test "$ver" = "$lock_ver" || { echo "VERSION ($ver) != Cargo.lock synora-core ($lock_ver)"; exit 1; }

      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked
