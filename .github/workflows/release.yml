name: Release

# VERSION bumps, this workflow file, or a manual dispatch publish v<VERSION>
# when that GitHub release is still missing.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      should: ${{ steps.meta.outputs.should }}
    steps:
      - uses: actions/checkout@v5

      - name: Inspect version and existing release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          sha=$(git rev-parse HEAD)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "GitHub release v$ver already exists"
            echo "should=false" >> "$GITHUB_OUTPUT"
          else
            echo "should=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.should == 'true'
    # Production still includes Ubuntu 22.04 (glibc 2.35). Building on
    # ubuntu-latest would link against newer glibc and fail at startup there.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            optional: false
          - target: aarch64-unknown-linux-gnu
            optional: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Check VERSION matches Cargo.toml and Cargo.lock
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\([0-9.]*\)".*/\1/')
          ver=$(tr -d '[:space:]' < VERSION)
          lock_ver=$(awk '$0=="name = \"synora-core\""{getline; if ($1=="version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)
          test "$ver" = "$cargo_ver" || { echo "VERSION ($ver) != Cargo.toml ($cargo_ver)"; exit 1; }
          test "$ver" = "$lock_ver" || { echo "VERSION ($ver) != Cargo.lock synora-core ($lock_ver)"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 180 sudo -E apt-get -o Acquire::Retries=5 update -y
          timeout 240 sudo -E apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VER: ${{ needs.gate.outputs.version }}
        run: |
          cd target/${{ matrix.target }}/release
          for b in synora synora-manager synora-worker; do
            tar czf ../../../$b-$VER-${{ matrix.target }}.tar.gz $b
          done
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: synora-${{ matrix.target }}
          path: synora-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [gate, build]
    if: always() && needs.gate.outputs.should == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.gate.outputs.version }}
        run: |
          shopt -s nullglob
          files=(artifacts/synora-*-x86_64-unknown-linux-gnu.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "x86_64 release artifacts are missing"
            exit 1
          fi
          gh release create "v$VER" \
            artifacts/synora-*.tar.gz \
            --title "v$VER" --notes-file RELEASE_NOTES.md \
            --target "${{ needs.gate.outputs.sha }}" \
          || gh release upload "v$VER" artifacts/synora-*.tar.gz --clobber
