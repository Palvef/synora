# Replace this image ID with the immutable result of docker image inspect.
# Synora skips overlapping ticks. Metadata is proxied by Nginx; this job only
# updates package candidates derived from access logs.
[[jobs]]
name = "pypi"
enabled = true
worker = "worker-nvme"
provider = "docker"
image = "synora-pypi:production"
storage = "pypi"
storage_name = "nvme"
resources = ["nvme"]
schedule = "interval"
every = "5m"
upstream = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/"
env = ["PYPI_CACHE_BYTES=549755813888", "PYPI_INDEX_MODE=proxy"]
volumes = [
  "/var/log/nginx/pypi-cache:/nginx-log:ro",
  "/var/log/nginx/mirrors:/nginx-legacy/nyist:ro",
  "/var/log/log/ha_mirrors:/nginx-legacy/ha:ro",
]
max_concurrency = 1
memory_limit = "16G"
cpu_limit = 8.0
statistics = "filesystem"
retry = 2
retry_delay = "5m"
