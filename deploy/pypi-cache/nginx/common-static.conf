# Included inside the isolated /pypi/ prefix and its nested locations.
root /data;
autoindex off;
access_log /var/log/nginx/pypi-cache/pypi.log synora_pypi;
# Keep the site's existing policy, including its named forbidden handler.
if ($is_forbidden) { return 418; }
if ($synora_pypi_allowed = 0) { return 404; }
if ($synora_pypi_unacceptable = 1) { return 406; }
if ($synora_pypi_redirect != "") { return 301 $synora_pypi_redirect; }
# Override inherited mirror HTML error pages for this protocol endpoint.
error_page 404 = @synora_pypi_missing;
error_page 418 = @forbidden;
try_files $synora_pypi_file @synora_pypi_missing;
