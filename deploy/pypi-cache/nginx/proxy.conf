# Metadata is always fresh from TUNA; only package payloads use the local cache.
if ($is_forbidden) { return 418; }
if ($synora_pypi_allowed = 0) { return 404; }
if ($synora_pypi_unacceptable = 1) { return 406; }
if ($synora_pypi_redirect != "") { return 301 $synora_pypi_redirect; }
error_page 418 = @forbidden;
access_log /var/log/nginx/pypi-cache/pypi.log synora_pypi;
rewrite ^ $synora_pypi_upstream_path break;
proxy_set_header Host mirrors.tuna.tsinghua.edu.cn;
proxy_ssl_server_name on;
proxy_ssl_name mirrors.tuna.tsinghua.edu.cn;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_buffering on;
proxy_redirect off;
proxy_pass https://mirrors.tuna.tsinghua.edu.cn;
