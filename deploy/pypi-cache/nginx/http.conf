# Include once in the http context; ngx_http_js_module must be loaded.
js_import synora_pypi from /etc/nginx/njs/synora-pypi.js;
js_set $synora_pypi_redirect synora_pypi.redirect;
js_set $synora_pypi_allowed synora_pypi.allowed;
js_set $synora_pypi_unacceptable synora_pypi.unacceptable;
js_set $synora_pypi_file synora_pypi.file;
js_set $synora_pypi_log_url synora_pypi.logUrl;
map $status $synora_pypi_proxied {
    default "0";
    302 "1";
}
log_format synora_pypi escape=json '{"timestamp":$msec,"clientip":"$remote_addr","url":"$synora_pypi_log_url","size":$body_bytes_sent,"status":$status,"user_agent":"$http_user_agent","proxied":"$synora_pypi_proxied"}';
