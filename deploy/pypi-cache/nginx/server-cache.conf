# Include in both public mirror server blocks, replacing their old /pypi/ rules.
# /etc/nginx/snippets/synora-pypi-common.conf is common-static.conf from this directory.
location = /pypi {
    if ($is_forbidden) { return 418; }
    return 301 /pypi/simple/;
}
location ^~ /pypi/ {
    include /etc/nginx/snippets/synora-pypi-common.conf;
    types { }
    default_type application/octet-stream;
    location ~ ^/pypi/simple(?:/|$) {
        include /etc/nginx/snippets/synora-pypi-proxy.conf;
        types {
            application/vnd.pypi.simple.v1+json v1_json;
            application/vnd.pypi.simple.v1+html v1_html;
            text/html html;
        }
        default_type text/html;
        add_header Vary Accept always;
    }
    location ~ ^/pypi/(?:json/[^/]+/?$|[^/]+/json/?$) {
        include /etc/nginx/snippets/synora-pypi-proxy.conf;
        proxy_hide_header Content-Type;
        add_header Content-Type application/json always;
        types { }
        default_type application/json;
    }
}
location @synora_pypi_missing {
    access_log /var/log/nginx/pypi-cache/pypi.log synora_pypi;
    default_type text/plain;
    js_content synora_pypi.missing;
}
