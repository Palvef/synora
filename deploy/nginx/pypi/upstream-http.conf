# Include once in the http context, before the PyPI proxy locations.
# Match the synchronization worker's IPv6 route to TUNA; resolve DNS dynamically.
upstream synora_pypi_tuna {
    zone synora_pypi_tuna 64k;
    resolver 127.0.0.53 ipv4=off valid=300s;
    resolver_timeout 5s;
    server mirrors.tuna.tsinghua.edu.cn:443 resolve;
    keepalive 16;
}
