# Include in the existing PyPI proxy snippet. The key uses the selected
# index.html/index.v1_html/index.v1_json path to keep representations separate.
proxy_cache synora_pypi_metadata;
proxy_cache_key "pypi-metadata:$synora_pypi_upstream_path";
proxy_cache_bypass $synora_pypi_metadata_bypass;
proxy_no_cache $synora_pypi_metadata_bypass $synora_pypi_metadata_not_success;
proxy_cache_valid 200 5m;
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_revalidate on;
proxy_cache_background_update on;
proxy_cache_use_stale updating;
add_header X-PyPI-Metadata-Cache $upstream_cache_status always;
