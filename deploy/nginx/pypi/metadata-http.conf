# Include once from the Nginx http context, after the PyPI njs variables.
proxy_cache_path /var/cache/nginx/synora-pypi-metadata levels=1:2
    keys_zone=synora_pypi_metadata:16m max_size=1g inactive=7d use_temp_path=off;

map $request_uri $synora_pypi_metadata_bypass {
    default 1;
    ~^/pypi/(?:web/)?simple(?:/|\?|$) 0;
    ~^/pypi/(?:web/)?json/ 0;
    ~^/pypi/[^/?]+/json(?:/|\?|$) 0;
    ~^/pypi/(?:web/)?packages/[^?]*\.metadata(?:\?|$) 0;
}

map $upstream_status $synora_pypi_metadata_not_success {
    default 1;
    200 0;
    304 0;
}
