[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2021"

[workspace.dependencies]
# --- internal (path) ---
synora-core = { path = "crates/synora-core" }
config = { path = "crates/config" }
db = { path = "crates/db" }
provider = { path = "crates/provider" }
engine = { path = "crates/engine" }
api = { path = "crates/api" }
nginx = { path = "crates/nginx" }
parser = { path = "crates/parser" }
netroute = { path = "crates/netroute" }
tui = { path = "crates/tui" }
storage = { path = "crates/storage" }
snapshot = { path = "crates/snapshot" }
httpfetch = { path = "crates/httpfetch" }

# --- cached locally (offline builds after first fetch) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
time = { version = "0.3.53", features = ["formatting", "macros", "parsing", "serde", "local-offset"] }
toml = "0.8"
toml_edit = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "native-tokio", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-postgres = "0.7"
postgres-types = "0.2"
base64 = "0.22"
bytes = "1"
libc = "0.2"

# --- fetched via proxy at M0, then cached ---
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
cron = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
time-tz = "2"
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
