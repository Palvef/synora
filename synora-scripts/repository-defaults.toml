schema = 1

[packages]
exclude_segments = ["dbg", "debug", "dbgsym", "debuginfo", "debugsource", "test", "tests", "testing", "testsuite"]
exclude_suffixes = [".ddeb"]

# Optional [groups] entries override discovery; all repositories share these names.
[groups]
mongodb-releases = ["8.0", "7.0", "6.0", "5.0", "4.4", "4.2"]

# Number of officially released distribution versions to retain.
[discovery]
rhel-current = 2
fedora-current = 2
ubuntu-lts = 3
debian-current = 3
debian-latest2 = 2
debian-latest = 1

[defaults.APT]
arches = ["amd64", "i386"]
[defaults.YUM]
arches = ["x86_64"]

# Empty repository tables inherit both protocol defaults.
[repositories.elastic]
[repositories.xanmod]
[repositories.virtualbox]
[repositories.gitlab-ce]
[repositories.bazel-apt.APT]
arches = ["amd64"]
[repositories.chef.APT]
arches = ["amd64", "i386", "aarch64"]
[repositories.cvmfs.APT]
arches = ["@auto"]
[repositories.cvmfs.YUM]
arches = ["aarch64", "i386", "ppc64le", "x86_64"]
[repositories.debian-elts.APT]
arches = ["@auto"]
[repositories.erlang.APT]
arches = ["@auto"]
[repositories.gitlab-runner.APT]
arches = ["amd64", "i386", "arm64"]
[repositories.gitlab-runner.APT.paths."/debian"]
arches = ["amd64", "i386", "arm64", "armhf"]
[repositories.gitlab-runner.YUM]
arches = ["x86_64", "aarch64"]
[repositories.kde-neon.APT]
arches = ["dep11", "cnf", "all", "amd64", "i386"]
[repositories.llvm-apt.APT]
arches = ["amd64", "arm64"]
[repositories.mozilla.APT]
arches = ["all", "amd64", "arm64"]
[repositories.mysql.YUM]
arches = ["x86_64", "aarch64"]
[repositories.influxdata.APT]
arches = ["amd64", "i386", "armhf", "arm64"]
[repositories.grafana.APT]
arches = ["amd64", "armhf", "arm64"]
[repositories.adoptium.APT]
arches = ["amd64", "armhf", "arm64"]
[repositories.adoptium.YUM]
arches = ["x86_64", "aarch64"]
[repositories.termux.APT]
arches = ["aarch64", "arm", "i686", "x86_64"]
[repositories.openmediavault.APT]
arches = ["amd64", "i386", "arm64", "armel", "armhf"]
[repositories.ros2.APT]
arches = ["amd64", "armhf", "arm64"]
[repositories.rudder.APT]
arches = ["amd64"]
[repositories.wine-builds.APT]
arches = ["amd64", "i386", "all"]

[repositories.mongodb.APT.paths."/apt/ubuntu"]
arches = ["amd64", "i386", "arm64"]
versions = ["@{ubuntu-lts}/mongodb-org/@{mongodb-releases}"]
components = ["multiverse"]
[repositories.mongodb.APT.paths."/apt/debian"]
versions = ["@{debian-current}/mongodb-org/@{mongodb-releases}"]
components = ["main"]
[repositories.mongodb.YUM]
versions = ["@rhel-current"]
components = ["@mongodb-releases"]

[repositories.proxmox.APT]
arches = ["amd64"]
versions = ["@debian-current"]
[repositories.proxmox.APT.paths."/debian/pve"]
components = ["pve-no-subscription", "pvetest"]
[repositories.proxmox.APT.paths."/debian/pbs"]
components = ["pbs-no-subscription"]
[repositories.proxmox.APT.paths."/debian/pbs-client"]
components = ["main"]
[repositories.proxmox.APT.paths."/debian/pmg"]
components = ["pmg-no-subscription"]
